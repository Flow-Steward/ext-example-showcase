page.overview.title: Apžvalga
page.overview.description: Plėtinio vykdymo aplinkos, būklės, atgalinio iškvietimo ir galimybių santrauka.
component.example_showcase_overview.title: Pavyzdinis demonstracinis plėtinys
component.example_showcase_overview.content: |-
  Pavyzdinis paketas Flow Steward plėtinių autoriams.
  Jis rodo manifest v2 vykdymo paketą, projekto nustatymus ir šifruojamus slaptuosius duomenis, atgalinio iškvietimo registravimą, darbo eigų paleidiklių metaduomenis, veiksmų ir užklausų manifestus, deklaratyvius sąsajos puslapius, Contract v2 kūrimo operacijas ir importuojamus demonstracinių darbo eigų, agentų bei įrankių artefaktus.
  Plėtinys sąmoningai sintetinis: išorinės API užklausos vykdomos imitacijos režimu, nebent projektas aiškiai išjungia imitacijos režimą ir įtraukia HTTPS serverį į leidžiamų sąrašą.
