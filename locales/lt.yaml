component.artifacts_overview.title: Artefaktų paketas
component.artifacts_overview.content: |-
  Aplanke `artifacts/` yra demonstracinės darbo eigos pradiniai duomenys, išskaidyti į darbo eigos, agento, įgūdžio, įrankio, duomenų rinkinio, išsaugotos užklausos ir ryšio manifestus.
  Faile `extension-descriptor.yaml` matyti, kaip darbo eigų, agentų, įgūdžių ir įrankių artefaktai nurodomi aprašo importui ir leidimo projekcijai.
