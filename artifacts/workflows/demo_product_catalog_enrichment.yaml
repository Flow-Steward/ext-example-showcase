workflow_id: demo_product_catalog_enrichment
version: 1.0.0
display_name: 'Demo: Product Catalog Enrichment'
description: Loads a sample CSV catalog, validates rows with for_each, batches them, enriches descriptions,
  and stores a CSV artifact through configured artifact storage.
enabled: true
trigger:
  confidence_threshold: 0.0
settings:
  traits:
    demo: true
  policies:
    branch_strategy: none
  callable:
    enabled: true
    trigger_channels:
    - ui
    - api
    - mcp
    - parent_workflow
    - webhook
    - schedule
    input_mode: fields
    strict_inputs: true
    expected_inputs:
    - name: request
      type: paragraph
      required: true
      description: Launch brief or review request shared with the parallel agent lanes.
    output_mode: variables_and_artifacts
    expected_outputs:
    - name: catalog_row_count
      type: number
      required: false
      description: Rows loaded from the source catalog.
    - name: enriched_ready_count
      type: number
      required: false
      description: Rows marked ready after enrichment.
    expected_artifacts:
    - name: catalog_artifact
      type: file
      required: false
      description: Stored enriched catalog CSV.
    side_effects:
    - kind: file_write
      target: artifact_storage
      description: Stores an enriched catalog CSV artifact.
builder_metadata_jsonb:
  purpose: Load catalog rows, validate them, batch them, enrich product details, and store a generated
    artifact.
  use_cases:
  - catalog enrichment
  - artifact generation
  - batch validation
  anti_use_cases:
  - human approval workflows
  - open-ended content drafting
  composition_role: data_enrichment_workflow
  determinism_level: deterministic
  safe_for_auto_use: true
tags:
- demo
- workflow-demo
- catalog
- artifact-storage
phases:
- phase_id: load_catalog
  phase_kind: start
  display_name: Load Catalog CSV
  description: Read the bundled CSV fixture.
  required_outputs:
  - catalog_rows
  gate:
    type: none
  steps:
  - step_id: load_catalog_rows
    display_name: Load catalog rows
    step_kind: connector
    connector_id: connector.demo_product_catalog_tools
    override:
      connector:
        function_name: demo_load_product_catalog
    input_mapping_jsonb:
      limit: literal:10
      job_id: state.job_id
    output_mapping_jsonb:
      rows: state.catalog_rows
      row_count: state.catalog_row_count
      source_file: state.catalog_source_file
      source_file_url: state.catalog_source_file_url
      source_artifact: state.catalog_source_artifact
- phase_id: validate_rows
  display_name: Validate Rows
  description: Run lightweight inline checks for each catalog row.
  required_outputs:
  - catalog_row_checks
  gate:
    type: none
  steps:
  - step_id: check_each_row
    display_name: Check each row
    step_kind: for_each
    override:
      for_each:
        source_path: state.catalog_rows
        item_name: state.row
        index_name: state.row_index
        result_target: state.catalog_row_checks
        concurrency_limit: 2
        continue_on_error: true
        steps:
        - step_kind: set_variable
          override:
            set_variable:
              assignments:
                state.row_name:
                  source: state.row.product_name
- phase_id: batch_rows
  display_name: Batch Rows
  description: Chunk the catalog before enrichment.
  required_outputs:
  - catalog_batches
  gate:
    type: none
  steps:
  - step_id: batch_catalog_rows
    display_name: Batch catalog rows
    step_kind: batch
    override:
      batch:
        source_path: state.catalog_rows
        batch_size: 5
        result_target: state.catalog_batches
        emit_partial_batch: true
- phase_id: inspect_batches_loop
  display_name: Inspect Batches Loop
  description: Demonstrates loop metadata by iterating over generated batches.
  loop:
    over: catalog_batches
    item_name: current_batch
  required_outputs:
  - current_batch_size
  gate:
    type: none
  steps:
  - step_id: measure_current_batch
    display_name: Measure current batch
    step_kind: connector
    connector_id: connector.std.text
    override:
      connector:
        function_name: length
        input_mapping:
          value: state.current_batch
        output_mapping:
          result: state.current_batch_size
    input_mapping_jsonb:
      value: state.current_batch
    output_mapping_jsonb:
      result: state.current_batch_size
- phase_id: enrich_catalog
  display_name: Enrich Catalog
  description: Create deterministic product descriptions.
  required_outputs:
  - enriched_catalog_rows
  gate:
    type: none
  steps:
  - step_id: enrich_rows
    display_name: Enrich rows
    step_kind: connector
    connector_id: connector.demo_product_catalog_tools
    override:
      connector:
        function_name: demo_enrich_product_catalog
    input_mapping_jsonb:
      rows: state.catalog_rows
      tone: literal:friendly
      max_rows: literal:100
      batch_label: literal:demo-extension
    output_mapping_jsonb:
      rows: state.enriched_catalog_rows
      row_count: state.enriched_row_count
      ready_count: state.enriched_ready_count
- phase_id: store_artifact
  display_name: Store Artifact
  description: Persist an enriched CSV artifact.
  required_outputs:
  - catalog_artifact
  gate:
    type: none
  steps:
  - step_id: store_catalog_artifact
    display_name: Store enriched CSV
    step_kind: connector
    connector_id: connector.demo_product_catalog_tools
    override:
      connector:
        function_name: demo_store_product_catalog_artifact
    input_mapping_jsonb:
      rows: state.enriched_catalog_rows
      job_id: state.job_id
      filename: literal:demo_enriched_catalog.csv
      workflow_id: literal:demo_product_catalog_enrichment
      retention_class: literal:run_window
    output_mapping_jsonb:
      artifact: state.catalog_artifact
      artifact_id: state.catalog_artifact_id
      download_url: state.catalog_artifact_url
- phase_id: complete
  display_name: Complete
  gate:
    type: none
  steps:
  - step_id: catalog_done
    display_name: Finish catalog demo
    step_kind: stop_success
    override:
      stop_success:
        message: Catalog enrichment completed.
