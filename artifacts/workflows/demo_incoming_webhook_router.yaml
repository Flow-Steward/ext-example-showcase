workflow_id: demo_incoming_webhook_router
version: 1.0.0
display_name: 'Demo: Incoming Webhook Router'
description: Designed for Incoming Webhook/Post demos. It copies mapped webhook fields into workflow state
  and routes invoice, approval, or generic events through separate branches so teams can test JSON, form,
  and text/plain mappings end to end.
enabled: true
trigger:
  confidence_threshold: 0.0
settings:
  traits:
    demo: true
    incoming_webhook: true
  policies:
    branch_strategy: none
  callable:
    enabled: true
    trigger_channels:
    - ui
    - api
    - mcp
    - parent_workflow
    - webhook
    - schedule
    input_mode: fields
    strict_inputs: true
    expected_inputs:
    - name: email
      label: Email
      type: string
      required: true
      description: Primary contact email. Automaps from body.email in JSON or form payloads.
    - name: event_type
      label: Event type
      type: string
      required: true
      description: Event discriminator such as invoice.created or approval.changed. Often mapped from
        a header like headers.x-event-type.
    - name: amount
      label: Amount
      type: number
      required: false
      description: Numeric amount for billing or order events.
    - name: approved
      label: Approved
      type: boolean
      required: false
      description: Approval flag that can be mapped from body.approved, form.approved, or a header/query
        source.
    - name: source
      label: Source
      type: string
      required: false
      description: Optional source marker such as a query parameter or provider tag.
    - name: payload_text
      label: Payload text
      type: paragraph
      required: false
      description: Optional raw text body. For text/plain entrypoints map this explicitly from body.body.
    output_mode: variables
    expected_outputs:
    - name: webhook_payload
      type: object
      required: false
      description: Captured webhook inputs copied into workflow state.
    - name: webhook_summary
      type: object
      required: false
      description: Branch-specific summary describing how the incoming webhook was routed.
    expected_artifacts: []
    side_effects: []
builder_metadata_jsonb:
  purpose: Capture webhook payload fields and route them through dedicated invoice, approval, or generic
    branches.
  use_cases:
  - incoming webhook routing
  - payload capture
  - event-type branching
  anti_use_cases:
  - open-ended reasoning
  - parallel agent review
  composition_role: routing_workflow
  determinism_level: deterministic
  safe_for_auto_use: true
tags:
- demo
- workflow-demo
- incoming-webhook
- routing
phases:
- phase_id: capture_payload
  phase_kind: start
  display_name: Capture Payload
  gate:
    type: none
  steps:
  - step_id: copy_webhook_inputs
    display_name: Copy webhook inputs
    step_kind: set_variable
    override:
      set_variable:
        assignments:
          state.webhook_payload.email:
            source: state.inputs.email
          state.webhook_payload.event_type:
            source: state.inputs.event_type
          state.webhook_payload.amount:
            source: state.inputs.amount
          state.webhook_payload.approved:
            source: state.inputs.approved
          state.webhook_payload.source:
            source: state.inputs.source
          state.webhook_payload.payload_text:
            source: state.inputs.payload_text
          state.webhook_payload.files:
            source: state.inputs.files
  - step_id: measure_event_type_length
    display_name: Measure event type length
    step_kind: connector
    connector_id: connector.std.text
    override:
      connector:
        function_name: length
        input_mapping:
          value: state.inputs.event_type
        output_mapping:
          result: state.webhook_payload.event_type_length
    input_mapping_jsonb:
      value: state.inputs.event_type
    output_mapping_jsonb:
      result: state.webhook_payload.event_type_length
- phase_id: route_event
  display_name: Route Event
  gate:
    type: none
  steps:
  - step_id: event_type_switch
    display_name: Route by event type
    step_kind: switch
    override:
      switch:
        selector: state.inputs.event_type
        cases:
          invoice.created: invoice_event
          approval.changed: approval_event
        default: generic_event
- phase_id: invoice_event
  display_name: Invoice Event
  gate:
    type: none
  steps:
  - step_id: set_invoice_summary
    display_name: Capture invoice summary
    step_kind: set_variable
    override:
      set_variable:
        assignments:
          state.webhook_summary.route: invoice.created
          state.webhook_summary.email:
            source: state.webhook_payload.email
          state.webhook_summary.amount:
            source: state.webhook_payload.amount
          state.webhook_summary.source:
            source: state.webhook_payload.source
  - step_id: invoice_continue
    display_name: Continue to acknowledge
    step_kind: if
    override:
      if:
        condition: state.webhook_summary
        on_true: acknowledge_event
        on_false: acknowledge_event
- phase_id: approval_event
  display_name: Approval Event
  gate:
    type: none
  steps:
  - step_id: set_approval_summary
    display_name: Capture approval summary
    step_kind: set_variable
    override:
      set_variable:
        assignments:
          state.webhook_summary.route: approval.changed
          state.webhook_summary.email:
            source: state.webhook_payload.email
          state.webhook_summary.approved:
            source: state.webhook_payload.approved
          state.webhook_summary.source:
            source: state.webhook_payload.source
  - step_id: approval_continue
    display_name: Continue to acknowledge
    step_kind: if
    override:
      if:
        condition: state.webhook_summary
        on_true: acknowledge_event
        on_false: acknowledge_event
- phase_id: generic_event
  display_name: Generic Event
  gate:
    type: none
  steps:
  - step_id: set_generic_summary
    display_name: Capture generic summary
    step_kind: set_variable
    override:
      set_variable:
        assignments:
          state.webhook_summary.route: generic
          state.webhook_summary.email:
            source: state.webhook_payload.email
          state.webhook_summary.payload_text:
            source: state.webhook_payload.payload_text
          state.webhook_summary.source:
            source: state.webhook_payload.source
  - step_id: generic_continue
    display_name: Continue to acknowledge
    step_kind: if
    override:
      if:
        condition: state.webhook_summary
        on_true: acknowledge_event
        on_false: acknowledge_event
- phase_id: acknowledge_event
  display_name: Acknowledge Event
  gate:
    type: none
  steps:
  - step_id: webhook_done
    display_name: Finish webhook routing
    step_kind: stop_success
    override:
      stop_success:
        message: Webhook demo completed for the routed event type.
