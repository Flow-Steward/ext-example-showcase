$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
properties:
  password:
    type: string
    minLength: 1
    title: Password
    description: Provider password. Flow Steward stores submitted secret values through project-scoped secret storage.
  api_token:
    type: string
    minLength: 1
    title: API token
    description: Optional bearer token for external API calls.
