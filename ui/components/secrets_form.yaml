component_id: secrets_form
type: form
title: Secrets
schema_ref: ../../schemas/secrets.schema.yaml
ui_schema:
  version: '1'
  type: form_ui
  layout:
    columns: 1
  fields:
  - field_id: password
    path: password
    widget: secret
    label: Password
    help: Stored by Flow Steward as a project-scoped encrypted secret.
  - field_id: api_token
    path: api_token
    widget: secret
    label: API Token
    help: Optional bearer token used by external API calls.
  - field_id: webhook_shared_secret
    path: webhook_shared_secret
    widget: secret
    label: Webhook Shared Secret
    help: Provider-side example secret; callback registration issues its HMAC secret separately.
  actions:
    save_label: Save Secrets
data:
  save_action: save_secrets
  save_mode: patch
