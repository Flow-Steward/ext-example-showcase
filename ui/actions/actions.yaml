actions:
- action_id: test_external_request
  workflow_visible: true
  title: Test external request
  description: Build a safe external API request and run it in mock mode by default.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  result_fields:
  - result.status
  - result.external_request.url
  - result.external_response.ok
  error_codes:
  - invalid_payload
  - invalid_config
  - external_request_blocked
  - external_request_failed
  mutates_platform: false
- action_id: send_review_notification
  workflow_visible: true
  title: Send review notification
  description: Demonstrates notification dispatch output shape.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  result_fields:
  - result.delivered
  - result.provider_message_id
  error_codes:
  - invalid_payload
  - provider_unavailable
  mutates_platform: false
- action_id: batch_score_records
  workflow_visible: true
  title: Batch score records
  description: Demonstrates bulk action result and partial failure shape.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  result_fields:
  - result.scored_records
  - result.failed_records
  error_codes:
  - invalid_payload
  - partial_failure
  mutates_platform: false
- action_id: run_demo_tool
  workflow_visible: true
  title: Run demo tool
  description: Demonstrates invoking bundled deterministic tool artifacts.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  result_fields:
  - result.tool_result
  error_codes:
  - invalid_payload
  - unknown_tool
  mutates_platform: false
- action_id: invoke_tool
  workflow_visible: true
  title: Invoke workflow tool
  description: Runtime action used by projected workflow tool manifests, including host-managed artifact grants.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  result_fields:
  - result
  error_codes:
  - invalid_payload
  - unknown_tool
  mutates_platform: false
- action_id: oauth_profile
  workflow_visible: true
  title: Read OAuth profile
  description: Demonstrates runtime OAuth access-token injection for a selected project connection.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  result_fields:
  - result.connection_id
  - result.token_received
  - result.refresh_token_visible
  error_codes:
  - missing_access_token
  mutates_platform: false
- action_id: receive_provider_event
  workflow_visible: false
  title: Receive provider event
  description: Handles a signed delivery on the events callback and returns a bounded summary of it.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  result_fields:
  - result.status
  - result.event.event_type
  - result.event.event_id
  - result.delivery.delivery_id
  - result.delivery.body_sha256
  error_codes:
  - invalid_payload
  - unexpected_callback
  mutates_platform: false
- action_id: configure_webhook
  workflow_visible: false
  title: Configure webhook
  description: Hands the events callback URL and signing secret to the provider; the example provider is a mock and stores nothing.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  result_fields:
  - result.url_configured
  - result.provider_mode
  error_codes:
  - callback_url_required
  - callback_secret_required
  mutates_platform: false
- action_id: get_webhook_status
  workflow_visible: false
  title: Get webhook status
  description: Reports the provider-side webhook status for the events callback (mock provider).
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  result_fields:
  - result.url_configured
  - result.pending_update_count
  error_codes: []
  mutates_platform: false
