schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  source_workflow_id: demo_dataset_open_orders
  flow_steward_version: 0.9.17
  description: Manual PostgreSQL Dataset example. Select a project-owned saved query
    after importing.
workflows:
- workflow_id: demo_dataset_open_orders
  version: 1.2.7
  display_name: 'Demo: Dataset Open Orders'
  description: Runs a saved dataset query that reads open orders from the orders table
    through the project's own PostgreSQL connection (MCP Toolbox) and then reuses
    the returned rows in a follow-up step.
  trigger:
    confidence_threshold: 0.0
  settings:
    traits:
      demo: true
      dataset_demo: true
    policies:
      branch_strategy: none
    callable:
      enabled: true
      trigger_channels:
      - ui
      - api
      - mcp
      - webhook
      - schedule
      input_mode: fields
      strict_inputs: true
      expected_inputs:
      - name: request_note
        type: string
        required: false
        description: Caller-supplied note proving named workflow input propagation.
      output_mode: variables
      expected_outputs:
      - name: demo_orders_result
        type: json
        required: false
        description: Dataset-query result payload with rows, row_count, and output_schema.
      - name: demo_order_count
        type: number
        required: false
        description: Count of rows returned from the saved query.
      expected_artifacts: []
      side_effects: []
      allow_empty_inputs: true
  tags:
  - demo
  - workflow-demo
  - dataset-query
  - saved-query
  steps:
  - step_id: load_open_orders
    display_name: Load open orders
    step_kind: dataset_query
    override:
      dataset_query:
        query_template_id: demo_open_orders_query
        result_target: state.demo_orders_result
        row_limit: 10
        timeout_seconds: 30
  - step_id: count_open_orders
    display_name: Count open orders
    step_kind: connector
    connector_id: connector.std.text
    override:
      connector:
        function_name: length
    input_mapping_jsonb:
      value: state.demo_orders_result.rows
    output_mapping_jsonb:
      result: state.demo_order_count
  - step_id: dataset_demo_done
    display_name: Finish dataset demo
    step_kind: stop_success
    override:
      stop_success:
        message: Dataset demo completed.
  groups: []
  participants: []
  for_each: []
  execution_graph:
    schema_version: 1
    entry:
      kind: step
      id: load_open_orders
    edges:
    - source:
        kind: step
        id: load_open_orders
      outcome:
        name: success
      target:
        kind: step
        id: count_open_orders
      rework: false
    - source:
        kind: step
        id: count_open_orders
      outcome:
        name: success
      target:
        kind: step
        id: dataset_demo_done
      rework: false
dependencies:
  extensions:
  - ref: flowsteward.data-connector-mcp-toolbox-postgres
    extension_id: flowsteward.data-connector-mcp-toolbox-postgres
    display_name: PostgreSQL
    required: true
import_hints:
  default_enabled: false
  import_state: draft
  conflict_policy: rename_workflow
