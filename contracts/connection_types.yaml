connection_types:
- connection_type_id: example_showcase_api
  display_name: Example External API
  description: Project-scoped connection for a third-party service used by the showcase extension.
  config_schema:
    type: object
    additionalProperties: false
    required:
    - base_url
    - username
    properties:
      base_url:
        type: string
        format: uri
        title: External API base URL
        description: HTTPS endpoint for the provider account. Live requests are blocked unless the host is allowlisted.
        default: https://api.example.test
      username:
        type: string
        minLength: 1
        title: Username
        description: Non-secret provider account name.
      tenant:
        type: string
        title: Tenant
        description: Optional provider tenant or workspace key.
      allowed_hosts:
        type: array
        title: Allowed hosts
        description: Host allowlist used before any optional live external API request.
        items:
          type: string
          minLength: 1
        default:
        - api.example.test
      mock_mode:
        type: boolean
        title: Mock mode
        description: Keep enabled for deterministic local tests and demos.
        default: true
      default_priority:
        type: string
        title: Default priority
        enum:
        - low
        - medium
        - high
        default: medium
      notification_channel:
        type: string
        title: Notification channel
        description: Named project channel used by notification examples.
        default: showcase-review
      labels:
        type: array
        title: Labels
        items:
          type: string
        default:
        - example
        - showcase

    allOf:
    - if:
        properties:
          mock_mode:
            const: false
        required:
        - mock_mode
      then:
        required:
        - allowed_hosts
  secret_schema:
    type: object
    additionalProperties: false
    properties:
      password:
        type: string
        minLength: 1
        title: Password
        description: Provider password. Flow Steward stores submitted secret values through project-scoped secret storage.
      api_token:
        type: string
        minLength: 1
        title: API token
        description: Optional bearer token for external API calls.
  capabilities:
    test_connection: true
    live_request: true
    workflow_trigger: true
    callback_ingress: true
  safety_profile:
    requires_https: true
    requires_host_allowlist: true
    stores_secret_values: false
- connection_type_id: example_showcase_oauth_account
  display_name: Example OAuth Account
  description: Mock third-party account authorized with OAuth2 Authorization Code + PKCE.
  auth:
    type: oauth2
    grant: authorization_code
    pkce: required
    authorization_endpoint: https://idp.example.com/authorize
    token_endpoint: https://idp.example.com/token
    revocation_endpoint: https://idp.example.com/revoke
    scopes:
      required:
      - read
      optional:
      - write
    client_credentials:
      client_id:
        source: platform_secret
        env: EXAMPLE_SHOWCASE_OAUTH_CLIENT_ID
      client_secret:
        source: platform_secret
        env: EXAMPLE_SHOWCASE_OAUTH_CLIENT_SECRET
        optional: true
    refresh:
      rotates_refresh_token: false
    token_placement: secrets
    secret_names:
      access_token: access_token
  capabilities:
    test_connection: true
    live_request: false
    workflow_trigger: false
    callback_ingress: false
  safety_profile:
    requires_https: true
    requires_host_allowlist: false
    stores_secret_values: false
