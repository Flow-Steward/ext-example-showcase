operations:
- operation_id: test_external_request
  display_name: "Fetch example external status"
  description: "Demonstrates a safe external API request pattern with HTTPS and host allowlisting. Use the bundled example project connections where the action requires one. These actions demonstrate SDK contracts and deterministic sample data; configure a real provider only for the documented live-request example. Example: Use resource_id=demo-resource-1 with live requests disabled to explore the request result without contacting a provider."
  operation_kind: source
  connection_type_ids: [example_showcase_api]
  category: external_api
  inputs:
  - name: resource_id
    value_type: text
    required: true
    display_name: Resource ID
    description: External resource identifier.
  - name: perform_live_request
    value_type: boolean
    required: false
    display_name: Perform live request
    description: Defaults to false so the bundled example stays deterministic.
  outputs:
  - name: status
    value_type: text
    display_name: Status
  - name: external_request
    value_type: object
    display_name: Request summary
  result_fields:
  - result.status
  - result.external_request.url
  error_codes:
  - invalid_payload
  - invalid_config
  - external_request_blocked
  - external_request_failed
- operation_id: send_review_notification
  display_name: "Prepare example review notification"
  description: "Return a simulated review-notification delivery result with a deterministic message ID. Use the bundled example project connections where the action requires one. These actions demonstrate SDK contracts and deterministic sample data; configure a real provider only for the documented live-request example. Example: Submit a warning-severity review message to inspect the simulated delivery result and message preview."
  operation_kind: human_channel
  connection_type_ids: [example_showcase_api]
  category: notifications
  inputs:
  - name: message
    value_type: text
    required: true
    description: "Review message included in the example notification request."
  - name: severity
    value_type: text
    required: false
    description: "Choose info, warning or critical for the example notification payload."
  outputs:
  - name: delivered
    value_type: boolean
  - name: provider_message_id
    value_type: text
  result_fields:
  - result.delivered
  - result.provider_message_id
  error_codes:
  - invalid_payload
  - provider_unavailable
- operation_id: batch_score_records
  display_name: "Score example records"
  description: "Demonstrates a bulk operation contract with partial failure reporting. Use the bundled example project connections where the action requires one. These actions demonstrate SDK contracts and deterministic sample data; configure a real provider only for the documented live-request example. Example: Score records [{\"id\":\"order-100\",\"active\":true},{\"id\":\"order-101\",\"active\":false}] and route the failed_records separately."
  operation_kind: bulk_action
  connection_type_ids: [example_showcase_api]
  category: batch
  supports_batch: true
  preferred_batch_size: 25
  max_batch_size: 100
  batch_input_field: records
  partial_failure_mode: report_failed_items
  supports_async_job: false
  inputs:
  - name: records
    value_type: array
    required: true
    description: "List of JSON record objects with id (or record_id). Records with a missing ID or active=false are reported in failed_records."
  outputs:
  - name: scored_records
    value_type: array
  - name: failed_records
    value_type: array
  result_fields:
  - result.scored_records
  - result.failed_records
  error_codes:
  - invalid_payload
  - partial_failure
- operation_id: run_demo_tool
  display_name: "Run example catalog tool"
  description: "Demonstrates mapping a workflow connector step to a bundled deterministic tool artifact. Use the bundled example project connections where the action requires one. These actions demonstrate SDK contracts and deterministic sample data; configure a real provider only for the documented live-request example. Example: Select demo_content_tools and pass {\"topic\":\"launch\"} to inspect the returned tool metadata and payload echo."
  operation_kind: action
  category: demo_artifacts
  inputs:
  - name: tool_id
    value_type: text
    required: true
    description: "Choose a bundled demo tool ID from the tool catalog, such as demo_content_tools. This action returns catalog metadata and echoes payload."
  - name: payload
    value_type: object
    required: false
    description: "JSON object echoed by the selected catalog tool; use it to explore input mapping."
  outputs:
  - name: tool_result
    value_type: object
  result_fields:
  - result.tool_result
  error_codes:
  - invalid_payload
  - unknown_tool
- operation_id: invoke_tool
  display_name: "Invoke bundled example tool"
  description: "Invokes a bundled demo tool and may publish an allowed run-window artifact. Use the bundled example project connections where the action requires one. These actions demonstrate SDK contracts and deterministic sample data; configure a real provider only for the documented live-request example. Example: Call demo_measure_text with arguments {\"value\":\"Launch update\"} to inspect the deterministic tool result."
  operation_kind: action
  category: demo_artifacts
  inputs:
  - name: tool_name
    value_type: text
    required: true
    description: "Bundled callable name. Use demo_measure_text for text metrics; see workflow-actions.md for other supported tools."
  - name: arguments
    value_type: object
    required: false
    description: "JSON object containing arguments accepted by the chosen bundled callable. For demo_measure_text, supply value."
  outputs:
  - name: result
    value_type: object
  result_fields:
  - result
  error_codes:
  - invalid_payload
  - unknown_tool
- operation_id: oauth_profile
  display_name: "Inspect example OAuth connection"
  description: "Demonstrates runtime access-token injection for an OAuth-backed project connection. Use the bundled example project connections where the action requires one. These actions demonstrate SDK contracts and deterministic sample data; configure a real provider only for the documented live-request example. Example: Check that a configured OAuth example connection receives an access token at runtime without returning the token."
  operation_kind: action
  connection_type_ids: [example_showcase_oauth_account]
  category: authentication
  inputs: []
  outputs:
  - name: token_received
    value_type: boolean
  - name: refresh_token_visible
    value_type: boolean
  - name: connection_id
    value_type: text
  result_fields:
  - result.connection_id
  - result.token_received
  - result.refresh_token_visible
  error_codes:
  - missing_access_token
