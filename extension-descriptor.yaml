    ref: artifacts/tools/demo_content_tools.yaml
    publish: true
  - tool_id: demo_product_catalog_tools
    ref: artifacts/tools/demo_product_catalog_tools.yaml
    publish: true
  - tool_id: demo_weather_tools
    ref: artifacts/tools/demo_weather_tools.yaml
    publish: true
  datasets:
